{% extends 'base.html' %}
{% block title %}Log in | JobRec{% endblock %}

{% block content %}

<style>
    /* Clean Enterprise Slate Header */
    .auth-header {
        background-color: #0f172a;
        padding: 80px 20px 120px 20px;
        margin-top: -20px;
        text-align: center;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
    }

    .auth-header h2 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 36px;
        letter-spacing: -1px;
        color: #ffffff;
    }

    .overlap-card {
        margin-top: -80px;
        position: relative;
        z-index: 10;
    }

    .auth-card {
        background: #FFFFFF;
        border-radius: 12px !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05) !important;
    }

    .auth-input-group {
        position: relative;
        margin-bottom: 20px;
    }

    .auth-input {
        border-radius: 8px;
        padding: 12px 14px 12px 44px;
        border: 1px solid #cbd5e1;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        transition: all 0.2s ease-in-out;
        width: 100%;
        background-color: #ffffff;
    }

    .auth-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        outline: none;
    }

    .input-icon {
        position: absolute;
        top: 50%;
        left: 14px;
        transform: translateY(-50%);
        color: #64748b;
        transition: color 0.2s ease;
        z-index: 5;
    }

    .auth-input-group:focus-within .input-icon {
        color: #2563eb;
    }

    .form-label {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
        font-size: 14px;
    }

    .btn-login-main {
        background: #2563eb;
        color: white !important;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 15px;
        border: none;
        transition: background 0.2s;
        width: 100%;
        margin-top: 10px;
    }

    .btn-login-main:hover {
        background: #1d4ed8;
    }
</style>

<div class="auth-header">
    <div class="container">
        <h2>Welcome Back</h2>
        <p class="text-white-50 small mx-auto" style="max-width: 500px;">
            Log in to your JobRec account to manage your applications and see new matches.
        </p>
    </div>
</div>

<div class="container overlap-card mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            
            <div class="card auth-card">
                <div class="card-body p-4 p-md-5">

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Username Field -->
                        <div class="mb-4">
                            <label class="form-label">Username</label>
                            <div class="auth-input-group">
                                <span class="input-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </span>
                                <input 
                                    type="text" 
                                    name="username" 
                                    class="auth-input"
                                    placeholder="yourname123"
                                    required
                                >
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="auth-input-group">
                                <span class="input-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input 
                                    type="password" 
                                    name="password" 
                                    class="auth-input"
                                    placeholder="••••••••"
                                    required
                                >
                            </div>
                        </div>

                        <button type="submit" class="btn-login-main">
                            Sign In to Account
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-4 border-top" style="border-color: #e2e8f0 !important;">
                        <p class="text-muted small mb-0">
                            New here? 
                            <a href="{% url 'register' %}" class="fw-bold ms-1" style="color: #2563eb; text-decoration: none;">
                                Create an account &rarr;
                            </a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
