{% extends 'base.html' %}
{% block title %}Applicant Profile | JobRec{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm" style="border-radius: 16px; border: 1px solid #e2e8f0 !important;">
            <div class="card-body p-5">

                <h3 class="mb-4 text-center fw-bold" style="font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a;">
                    Applicant Profile
                </h3>

                <hr style="border-color: #e2e8f0; margin-bottom: 30px;">

                <div class="mb-4">
                    <p class="text-muted small text-uppercase fw-semibold mb-1" style="letter-spacing: 0.5px;">Name</p>
                    <h5 class="fw-bold" style="color: #0f172a;">{{ applicant.username }}</h5>
                </div>

                <div class="mb-4">
                    <p class="text-muted small text-uppercase fw-semibold mb-1" style="letter-spacing: 0.5px;">Skills</p>
                    <p class="mb-0 fw-medium" style="color: #334155;">{{ applicant_skills }}</p>
                </div>

                {% if applicant.email %}
                <div class="mb-4">
                    <p class="text-muted small text-uppercase fw-semibold mb-1" style="letter-spacing: 0.5px;">Email Address</p>
                    <p class="mb-0 fw-medium" style="color: #334155;">{{ applicant.email }}</p>
                </div>
                {% endif %}

                <div class="text-center mt-5">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 8px; font-weight: 600; font-size: 14px;">
                        Back
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
